<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapportini Enterprise PROS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); }
        
        header { background: white; padding: 15px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.3rem; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .status-badge { background: #dcfce7; color: #166534; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }

        .nav-tabs { display: flex; gap: 10px; background: white; padding: 10px 30px; border-bottom: 1px solid var(--border); }
        .tab-btn { padding: 10px 20px; border: none; background: none; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border); display: flex; align-items: center; gap: 20px; }
        .stat-icon { font-size: 2rem; color: var(--primary); background: #eff6ff; padding: 15px; border-radius: 8px; }
        .stat-val { font-size: 1.8rem; font-weight: bold; }
        .stat-label { color: #64748b; font-size: 0.9rem; }

        .card { background: white; padding: 25px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 25px; }
        .card-header { font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .full-width { grid-column: span 2; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
        
        button.btn-submit { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; }
        button.btn-submit:hover { background: var(--primary-dark); }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        th { background: #f8fafc; color: #475569; font-weight: 600; }
        
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .badge-approvato { background: #dcfce7; color: #166534; }
        .badge-revisione { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-file-invoice"></i> Rapportini Enterprise PROS</div>
        <div class="status-badge"><i class="fa-solid fa-circle"></i> Sistema Online (SQLite DB)</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('admin')"><i class="fa-solid fa-user-shield"></i> Amministratore</button>
        <button class="tab-btn" onclick="switchTab('operatori')"><i class="fa-solid fa-hard-hat"></i> Portale Operatori</button>
        <button class="tab-btn" onclick="switchTab('fornitori')"><i class="fa-solid fa-truck"></i> Portale Fornitori</button>
    </div>

    <div class="container">
        <!-- SEZIONE AMMINISTRATORE -->
        <div id="admin" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-folder-open"></i></div>
                    <div>
                        <div class="stat-val" id="stat-totali">0</div>
                        <div class="stat-label">Rapportini Totali</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-clock"></i></div>
                    <div>
                        <div class="stat-val" id="stat-ore">0h</div>
                        <div class="stat-label">Ore Totali Registrate</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <div>
                        <div class="stat-val" id="stat-revisione">0</div>
                        <div class="stat-label">In Revisione</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Gestione Rapportini Ricevuti</div>
                <table>
                    <thead>
                        <tr>
                            <th>Codice</th>
                            <th>Data</th>
                            <th>Operatore / Fornitore</th>
                            <th>Cantiere / Progetto</th>
                            <th>Ore</th>
                            <th>Stato</th>
                            <th>PDF</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- SEZIONE OPERATORI -->
        <div id="operatori" class="tab-content">
            <div class="card">
                <div class="card-header">Inserimento Rapportino Operatore</div>
                <form id="opForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Codice Rapportino:</label>
                            <input type="text" id="op-codice" required placeholder="Es. RAP-2026-001">
                        </div>
                        <div class="form-group">
                            <label>Data Intervento:</label>
                            <input type="date" id="op-data" required>
                        </div>
                        <div class="form-group">
                            <label>Nome Operatore:</label>
                            <input type="text" id="op-nome" required placeholder="Es. Mario Rossi">
                        </div>
                        <div class="form-group">
                            <label>Cantiere / Progetto:</label>
                            <input type="text" id="op-cantiere" required placeholder="Es. Cantiere Milano Sud">
                        </div>
                        <div class="form-group">
                            <label>Ore Lavorate:</label>
                            <input type="number" id="op-ore" step="0.5" required placeholder="8">
                        </div>
                        <div class="form-group">
                            <label>Allegato PDF (Opzionale):</label>
                            <input type="file" id="op-pdf" accept="application/pdf">
                        </div>
                        <div class="form-group full-width">
                            <label>Descrizione Attività / Note:</label>
                            <textarea id="op-note" rows="3" placeholder="Descrivi le lavorazioni eseguite..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">Salva nel Database (Operatore)</button>
                </form>
            </div>
        </div>

        <!-- SEZIONE FORNITORI -->
        <div id="fornitori" class="tab-content">
            <div class="card">
                <div class="card-header">Registrazione Prestazione Fornitore</div>
                <form id="fornForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Codice Scheda/Fattura:</label>
                            <input type="text" id="forn-codice" required placeholder="Es. FORN-2026-001">
                        </div>
                        <div class="form-group">
                            <label>Data Fornitura:</label>
                            <input type="date" id="forn-data" required>
                        </div>
                        <div class="form-group">
                            <label>Ragione Sociale Fornitore:</label>
                            <input type="text" id="forn-nome" required placeholder="Es. TechSupplies Srl">
                        </div>
                        <div class="form-group">
                            <label>Impianto / Progetto:</label>
                            <input type="text" id="forn-cantiere" required placeholder="Es. Impianto Roma Nord">
                        </div>
                        <div class="form-group">
                            <label>Ore / Prestazione:</label>
                            <input type="number" id="forn-ore" step="0.5" required placeholder="6">
                        </div>
                        <div class="form-group">
                            <label>Allegato Documento/PDF:</label>
                            <input type="file" id="forn-pdf" accept="application/pdf">
                        </div>
                        <div class="form-group full-width">
                            <label>Dettaglio Fornitura / Note:</label>
                            <textarea id="forn-note" rows="3" placeholder="Dettagli del materiale o servizio fornito..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" style="background-color: #059669;">Salva nel Database (Fornitore)</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('op-data').value = today;
        document.getElementById('forn-data').value = today;

        async function loadData() {
            try {
                const res = await fetch('/api/rapportini');
                const data = await res.json();
                
                let totOre = 0;
                let inRev = 0;
                const tbody = document.getElementById('adminTableBody');
                tbody.innerHTML = '';

                data.forEach(item => {
                    const ore = parseFloat(item.note.match(/\[Ore: ([\d.]+)\]/)?.[1] || 8);
                    totOre += ore;
                    
                    const isForn = item.codice.startsWith('FORN');
                    const stato = isForn ? 'In Revisione' : 'Approvato';
                    if(stato === 'In Revisione') inRev++;

                    const row = `<tr>
                        <td><b>${item.codice}</b></td>
                        <td>${item.data}</td>
                        <td>${item.operatore}</td>
                        <td>${item.cliente}</td>
                        <td>${ore} ore</td>
                        <td><span class="badge ${stato === 'Approvato' ? 'badge-approvato' : 'badge-revisione'}">${stato}</span></td>
                        <td>${item.pdf_path ? `<a href="/${item.pdf_path}" target="_blank" style="color:#2563eb"><i class="fa-solid fa-file-pdf"></i> PDF</a>` : '-'}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });

                document.getElementById('stat-totali').innerText = data.length;
                document.getElementById('stat-ore').innerText = totOre + 'h';
                document.getElementById('stat-revisione').innerText = inRev;
            } catch(e) {
                console.error("Errore nel recupero dati:", e);
            }
        }

        async function submitForm(e, prefix) {
            e.preventDefault();
            const formData = new FormData();
            const ore = document.getElementById(`${prefix}-ore`).value;
            const noteText = document.getElementById(`${prefix}-note`).value;

            formData.append('codice', document.getElementById(`${prefix}-codice`).value);
            formData.append('data', document.getElementById(`${prefix}-data`).value);
            formData.append('operatore', document.getElementById(`${prefix}-nome`).value);
            formData.append('cliente', document.getElementById(`${prefix}-cantiere`).value);
            formData.append('note', `${noteText} [Ore: ${ore}]`);

            const pdfFile = document.getElementById(`${prefix}-pdf`).files[0];
            if(pdfFile) formData.append('pdf', pdfFile);

            const res = await fetch('/api/rapportini', { method: 'POST', body: formData });
            if(res.ok) {
                alert('Rapportino salvato con successo nel Database SQLite!');
                document.getElementById(e.target.id).reset();
                document.getElementById(`${prefix}-data`).value = today;
                loadData();
                switchTab('admin');
            }
        }

        document.getElementById('opForm').addEventListener('submit', (e) => submitForm(e, 'op'));
        document.getElementById('fornForm').addEventListener('submit', (e) => submitForm(e, 'forn'));

        loadData();
    </script>
</body>
</html>
