services:
  # BACKEND API (Gratuito)
  - type: web
    name: pros-backend-api
    env: node
    plan: free
    rootDir: backend-api
    buildCommand: npm install && npx prisma generate
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: pros-db
          property: connectionString

  # PORTALE ADMIN (Gratuito)
  - type: web
    env: static
    name: pros-portal-admin
    rootDir: admin-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist

databases:
  # DATABASE POSTGRESQL (Gratuito)
  - name: pros-db
    databaseName: pros_db
    user: pros_user
    plan: free
