services:
  # 1. API BACKEND & LICENZIAMENTO PROS
  - type: web
    name: pros-backend-api
    env: node
    rootDir: backend-api
    buildCommand: npm install && npx prisma generate
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: pros-db
          property: connectionString

  # 2. PORTALE AMMINISTRATORE
  - type: web
  env: static
    name: pros-portal-admin
    rootDir: admin-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. PORTALE OPERATORI
  - type: web
  env: static
    name: pros-portal-operatori
    rootDir: operator-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 4. PORTALE FORNITORE
  - type: web
  env: static
    name: pros-portal-fornitore
    rootDir: supplier-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: pros-db
    plan: free
